# Added 2026-09-23 (family hardening): the same gate as fhir_r4's ci.yml.
# Every package is formatted, analyzed and tested on every push; a failure
# in one package does not stop the others from being checked. The two CDSi
# workbook suites pass on every case: the 26 rows the project has ruled
# against assert the ruling (cicada/test/rulings.dart), not CDC's value.
name: CI
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      # Every decision-bearing engine function names the CDSi rule it
      # implements; the checker exits non-zero if one does not.
      - name: Engine spec citations
        run: cd cicada && python3 tool_check_spec_citations.py

      - name: Format, analyze & test each package
        run: |
          failed=""
          for d in cicada cicada_generator cicada_flutter; do
            echo "::group::$d"
            if grep -q "^  flutter:" "$d/pubspec.yaml"; then bin=flutter; else bin=dart; fi
            if ! (
              set -e
              cd "$d"
              $bin pub get
              # The package's own directories only: platform folders hold
              # third-party Dart the formatter must not judge.
              for f in lib test example bin tool; do
                if [ -d "$f" ]; then
                  dart format --output=none --set-exit-if-changed "$f"
                fi
              done
              $bin analyze
              if [ -d test ]; then $bin test; fi
            ); then
              failed="${failed} ${d}"
              echo "::error::${d} failed"
            fi
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then
            echo "::error::Failing packages:${failed}"
            exit 1
          fi
          echo "All packages passed"
