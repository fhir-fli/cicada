name: cicada_generator
description: Pulling the data from the cloud to make supporting data for Cicada
publish_to: "none"

environment:
  sdk: ^3.7.0
  
dependencies:
  cicada:
    path: ../cicada
  collection: ^1.19.1
  csv: ^6.0.0
  excel: ^4.0.6
  fhir_r4: ^0.12.0
  gsheets: ^0.5.0
  xml2json: ^6.2.7

dependency_overrides:
  # excel 4.0.6 crashes on a workbook whose sharedStrings.xml repeats a
  # value (CDC's Hib 4.65 workbook). third_party/excel/CICADA-PATCH.md.
  archive: ^3.6.1
  excel:
    path: third_party/excel

dev_dependencies:
  test: ^1.29.0
  very_good_analysis: ^10.1.0
