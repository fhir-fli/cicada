<!DOCTYPE html>
<!--
  Cicada's display-only page for the EHR's chart tab. The EHR opens it with
  `iss` and `launch`; the sign-in sends the tab back to callback.html, which
  is this same page. Nothing on it is clickable: it shows the forecast.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cicada immunization forecast</title>
  <style>
    :root {
      --text: #1b1b1f; --muted: #5d5e66; --line: #d9d9e0; --card: #ffffff;
      --page: #f6f6f9; --due: #a4161a; --soon: #b35c00; --done: #2b6e3f;
      --other: #5d5e66; --band: #e8eef8;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 12px 16px; background: var(--page); color: var(--text);
      font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    h1 { font-size: 18px; margin: 8px 0; }
    h2 { font-size: 15px; margin: 18px 0 6px; }
    h3 { font-size: 14px; margin: 0; }
    .status, .detail, .basis, .subtitle, .note { color: var(--muted); }
    .detail { white-space: pre-wrap; }
    .banner {
      display: flex; flex-wrap: wrap; gap: 4px 16px; padding: 8px 12px;
      background: var(--band); border-radius: 6px; font-weight: 600;
    }
    .summary { display: flex; gap: 12px; font-weight: 600; margin: 8px 0 0; }
    .basis { font-size: 12px; margin: 4px 0 0; }
    .card {
      background: var(--card); border: 1px solid var(--line);
      border-left: 4px solid var(--other); border-radius: 6px;
      padding: 8px 12px; margin: 0 0 6px;
    }
    .card.overdue, .card.dueNow { border-left-color: var(--due); }
    .card.dueSoon { border-left-color: var(--soon); }
    .card.complete, .card.immune { border-left-color: var(--done); }
    .card-head { display: flex; justify-content: space-between; gap: 8px; }
    .badge { font-size: 12px; font-weight: 600; color: var(--other); }
    .badge.overdue, .badge.dueNow { color: var(--due); }
    .badge.dueSoon { color: var(--soon); }
    .badge.complete, .badge.immune { color: var(--done); }
    .subtitle, .note { margin: 2px 0 0; font-size: 13px; }
    dl {
      display: grid; grid-template-columns: max-content 1fr;
      gap: 2px 12px; margin: 6px 0 0;
    }
    dt { color: var(--muted); }
    dd { margin: 0; }
    table { border-collapse: collapse; margin-top: 6px; width: 100%; }
    th, td {
      text-align: left; padding: 2px 12px 2px 0; vertical-align: top;
      border-bottom: 1px solid var(--line);
    }
    th { color: var(--muted); font-weight: 600; }
  </style>
  <script defer src="main.dart.js"></script>
</head>
<body>
  <main id="cicada"><p class="status">Loading…</p></main>
</body>
</html>
